server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  resolver 127.0.0.11 ipv6=off valid=10s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Frontend calls /login and expects JSON
  location = /login {
    proxy_pass http://rectification:3001/login;
  }

  # (Optional) if your frontend ever calls the API directly
  location /api/ {
    proxy_pass http://rectification:3001;
  }

  # Optional routes to open apps
  location /rectificacion/ { proxy_pass http://rectification:3001/; }
  location /rectification/ { proxy_pass http://rectification:3001/; }
  location /carne/         { proxy_pass http://carne:5000/; }

  # Dashboard UI
  location / {
    proxy_pass http://dashboard:3002/;
  }
}
