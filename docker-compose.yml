services:
  nginx:
    image: nginx:alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
      - rectification
      - carne

  dashboard:
    build: ./dashboard
    container_name: portal-dashboard
    restart: unless-stopped
    expose:
      - "3002"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - SESSION_COOKIE_NAME=uma.sid
      - SESSION_SECRET=qwertasdfgzxcvb123poiuy

  rectification:
    build: ./rectification
    container_name: portal-rectification
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./rectification/.env
        environment:
      - REDIS_URL=redis://redis:6379
      - SESSION_COOKIE_NAME=uma.sid
      - SESSION_SECRET=qwertasdfgzxcvb123poiuy
      - PUBLIC_BASE=/rectificacion
    depends_on:
      - redis


  carne-photo-api:
    build:
      context: ./Carne_Univarsario
      dockerfile: photo-api/Dockerfile
    container_name: portal-carne-photo-api
    restart: unless-stopped
    expose:
      - "8000"

  carne:
    build: ./Carne_Univarsario
    container_name: portal-carne
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PHOTO_API_URL=http://carne-photo-api:8000
    depends_on:
      - carne-photo-api
    environment:
      - REDIS_URL=redis://redis:6379
      - SESSION_COOKIE_NAME=uma.sid
      - SESSION_SECRET=qwertasdfgzxcvb123poiuy

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    expose:
      - "6379"
